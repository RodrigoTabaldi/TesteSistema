  <path d="M39 24 L47 32 L39 40" stroke="#101828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 22 L28 42" stroke="#2E5BFF" stroke-width="4" stroke-linecap="round"/>
