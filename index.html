<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080C18" />
    <link rel="icon" type="image/svg+xml" href="/brand/kronos-logomark.svg" />
    <title>Kronos · Gestão Financeira e Desendividamento</title>
    <meta name="description" content="Organize dívidas, saia do vermelho e domine seu dinheiro — para pessoa física, autônomo, pequena empresa e empresa." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica tema salvo antes da pintura (evita flash)
      (function () {
        try {
          var t =
            localStorage.getItem("kronos:theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
